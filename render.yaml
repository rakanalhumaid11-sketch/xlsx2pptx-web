services:
  - type: web
    name: xlsx2pptx-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --max-requests 80 --max-requests-jitter 20"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
