{% extends "base.html" %}
{% block content %}
<div class="wrap">

  <div class="page-head">
    <h1>تقرير جديد</h1>
    <p>ارفع ملف الإكسل ويُبنى التقرير كاملًا.</p>
  </div>

  {% if error %}<div class="errors">{{ error }}</div>{% endif %}

  <form method="post" action="{{ url_for('start') }}" enctype="multipart/form-data">

    <label class="dropzone" id="zone" for="excel_file">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 16V4"></path>
        <path d="m7 9 5-5 5 5"></path>
        <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path>
      </svg>
      <span class="dz-title" id="dzTitle">اسحب ملف الإكسل هنا</span>
      <span class="dz-hint" id="dzHint">أو اضغط للاختيار — صيغة ‎.xlsx‎</span>
    </label>
    <input class="hidden-input" id="excel_file" type="file" name="excel_file" accept=".xlsx,.xlsm" required>

    <label class="field">
      <span class="field-label">رقم إشعار الفحص <em>— اختياري</em></span>
      <input type="text" name="notice" placeholder="4121050117" inputmode="numeric">
    </label>

    <input type="hidden" name="maps_link_sent" value="1">
    <label class="switch-row">
      <span class="switch">
        <input type="checkbox" name="maps_link" value="1" id="mapsLink" checked>
        <span class="switch-knob" aria-hidden="true"></span>
      </span>
      <span class="switch-text">
        <b>رابط الموقع على الإحداثيات</b>
        <em id="mapsHint">مفعّل — الضغط على الإحداثيات في الشريحة يفتح الموقع في خرائط جوجل</em>
      </span>
    </label>

    <button class="btn" type="submit">توليد التقرير</button>
  </form>

</div>

<script>
(function () {
  var input = document.getElementById("excel_file");
  var zone = document.getElementById("zone");
  var title = document.getElementById("dzTitle");
  var hint = document.getElementById("dzHint");

  function show() {
    if (input.files && input.files.length) {
      var f = input.files[0];
      zone.classList.add("filled");
      title.textContent = f.name;
      hint.textContent = (f.size / 1048576).toFixed(1) + " ميجابايت — جاهز للرفع";
    }
  }
  input.addEventListener("change", show);

  // الخيار يُحفظ في المتصفح، فمن أغلقه مرة لا يضطر لإغلاقه في كل تقرير
  var ml = document.getElementById("mapsLink");
  var mh = document.getElementById("mapsHint");
  function paintMaps() {
    mh.textContent = ml.checked
      ? "مفعّل — الضغط على الإحداثيات في الشريحة يفتح الموقع في خرائط جوجل"
      : "مغلق — تُكتب الإحداثيات نصًّا بلا رابط";
  }
  try {
    var saved = localStorage.getItem("maps_link");
    if (saved !== null) ml.checked = saved === "1";
  } catch (e) {}
  paintMaps();
  ml.addEventListener("change", function () {
    paintMaps();
    try { localStorage.setItem("maps_link", ml.checked ? "1" : "0"); } catch (e) {}
  });

  ["dragenter", "dragover"].forEach(function (e) {
    zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (e) {
    zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.remove("drag"); });
  });
  zone.addEventListener("drop", function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files.length) {
      input.files = ev.dataTransfer.files;
      show();
    }
  });
})();
</script>
{% endblock %}
