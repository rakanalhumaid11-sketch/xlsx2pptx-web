{% extends "base.html" %}
{% block content %}
<div class="wrap">

  <div class="page-head">
    <h1 id="statusTitle">جاري توليد التقرير</h1>
    <p id="statusHint">يُبنى التقرير شريحة بشريحة. لا تغلق الصفحة.</p>
  </div>

  <div id="liveBox">
    <div class="pct" id="pct">0%</div>
    <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
    <span class="hint" id="counter"></span>
    <span class="hint" id="source"></span>
    <div id="stallBox"></div>
  </div>

  <div id="errorBox"></div>

  <div id="downloadBox" style="display:none;">
    <a class="btn" id="downloadLink" href="#">تحميل التقرير</a>
    <ul class="stats" id="stats"></ul>
    <a class="back-link" href="{{ url_for('index') }}">توليد تقرير آخر</a>
  </div>

</div>

<script>
var jobId = "{{ job_id }}";

function poll() {
  fetch("/job/" + jobId + "/status").then(function (r) { return r.json(); }).then(function (data) {
    if (data.stage === "error") {
      document.getElementById("statusTitle").textContent = "تعذّر توليد التقرير";
      document.getElementById("statusHint").textContent = "";
      document.getElementById("liveBox").style.display = "none";
      document.getElementById("errorBox").innerHTML =
        '<div class="errors">' + (data.error_message || "خطأ غير معروف") + '</div>';
      return;
    }

    if (data.stage === "waiting") {
      document.getElementById("statusTitle").textContent = "في الانتظار";
      document.getElementById("statusHint").textContent = "يوجد تقرير آخر قيد التوليد. سيبدأ تقريرك تلقائيًا بعد ثوانٍ.";
      setTimeout(poll, 1500);
      return;
    }

    var p = data.progress || { done: 0, total: 1 };
    var pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("pct").textContent = pct + "%";
    if (p.total > 1) {
      document.getElementById("counter").textContent = p.done + " من " + p.total + " ملاحظة";
    }

    if (data.photo_source === "web") {
      document.getElementById("source").textContent =
        "الصور غير مخزّنة داخل ملف الإكسل، فتُنزَّل من الإنترنت — قد يستغرق ذلك عدة دقائق.";
    } else if (data.photo_source === "file") {
      document.getElementById("source").textContent = "الصور تُقرأ من داخل ملف الإكسل.";
    }

    // شريط ساكن لدقائق يعني غالبًا أن العملية توقفت على الخادم
    document.getElementById("stallBox").innerHTML = (data.stalled_for > 180)
      ? '<div class="errors">لم يتقدّم التوليد منذ ' + Math.round(data.stalled_for / 60) +
        ' دقائق. يُرجَّح أن العملية توقفت على الخادم — أعد المحاولة، وإن تكرر الأمر فالملف كبير على الخطة المجانية.</div>'
      : "";

    if (data.stage === "done") {
      var r = data.result || {};
      document.getElementById("statusTitle").textContent = "التقرير جاهز";
      document.getElementById("statusHint").textContent = r.is_zip
        ? "قُسّم التقرير إلى " + r.parts + " ملفات داخل ملف مضغوط. نزّله الآن — تُحذف الملفات من الخادم تلقائيًا بعد ساعات قليلة."
        : "نزّله الآن — تُحذف الملفات من الخادم تلقائيًا بعد ساعات قليلة.";
      document.getElementById("liveBox").style.display = "none";
      var dl = document.getElementById("downloadLink");
      dl.href = "/job/" + jobId + "/download";
      if (r.is_zip) { dl.textContent = "تحميل التقارير (مضغوطة)"; }
      document.getElementById("stats").innerHTML =
        "<li><span>المغذي</span><b>" + (r.feeder || "—") + "</b></li>" +
        "<li><span>عدد الملاحظات</span><b>" + (r.records || 0) + "</b></li>" +
        "<li><span>أنواع الملاحظات</span><b>" + (r.types || 0) + "</b></li>" +
        "<li><span>إجمالي الشرائح</span><b>" + (r.slides || 0) + "</b></li>" +
        "<li><span>صور «قبل»</span><b>" + (r.photos_ok || 0) +
        (r.photos_missing ? " — بدون صورة: " + r.photos_missing : "") + "</b></li>" +
        "<li><span>صور «بعد»</span><b>" + (r.after_ok || 0) +
        ((r.records - (r.after_ok || 0)) > 0
          ? " — خانة فارغة: " + (r.records - (r.after_ok || 0)) : "") + "</b></li>";
      document.getElementById("downloadBox").style.display = "block";
      return;
    }

    // نسأل الخادم كل ثانية في البداية ثم نخفّف إلى كل ثلاث ثوانٍ: التقارير
    // الطويلة لا تحتاج تحديثًا لحظيًا، وتقليل الطلبات يخفّف الحمل عن الخادم
    setTimeout(poll, p.done > 20 ? 3000 : 1200);
  }).catch(function () { setTimeout(poll, 3000); });
}
poll();
</script>
{% endblock %}
